name: CMS quality

on:
  push:
    branches: [main, develop, "release/*"]
  pull_request:
    branches:
      - develop
      - main
      - "release/*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cms-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code and browser gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://fixtures.supabase.local
      NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-anon-key
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3200/api/e2e
      NEXT_PUBLIC_AUTH_APP_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ALLOWED_REDIRECT_DOMAINS: 127.0.0.1:3200,localhost:3200
      NEXT_PUBLIC_ENABLE_E2E_FIXTURES: "1"
    steps:
      - name: Check out CMS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # verified upstream actions/checkout
        with:
          persist-credentials: false
          path: xynes-cms-console-web

      - name: Check out Lumia design system
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # verified upstream actions/checkout
        with:
          persist-credentials: false
          repository: Xynes-Studio/lumia-ds
          ref: 104865556b3f4b1169884943e3f71547cf42847f
          path: lumia-ds

      - name: Check out auth SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # verified upstream actions/checkout
        with:
          persist-credentials: false
          repository: Xynes-Studio/xynes-auth-sdk
          ref: a9e6265863ea31fa14eb991da95615494f2a6822
          path: xynes-auth-sdk

      - name: Check out locale package
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # verified upstream actions/checkout
        with:
          persist-credentials: false
          repository: Xynes-Studio/xynes-i18n
          ref: 16c31d264e1065c443f57311fc96768022c1605b
          path: xynes-i18n

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # verified upstream actions/setup-node
        with:
          node-version: 22.22.0

      - name: Enable the pinned package manager
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # verified upstream v4
        with:
          version: 10.33.0


      - name: Build Lumia design system
        working-directory: lumia-ds
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @lumia-ui/components... \
            --filter @lumia-ui/editor... \
            --filter @lumia-ui/icons... \
            --filter @lumia-ui/layout... \
            --filter @lumia-ui/marketing... \
            build

      - name: Build auth SDK
        working-directory: xynes-auth-sdk
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build locale package
        working-directory: xynes-i18n
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install CMS dependencies
        working-directory: xynes-cms-console-web
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for Playwright
        working-directory: xynes-cms-console-web
        run: pnpm exec playwright install --with-deps chrome

      - name: Run release verification
        working-directory: xynes-cms-console-web
        run: |
          pnpm exec eslint .
          pnpm exec tsc --noEmit
          pnpm exec vitest run
          pnpm exec vitest run --coverage
          NODE_ENV=production pnpm exec next build --webpack
          pnpm exec playwright test

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified upstream actions/upload-artifact
        with:
          name: cms-quality-failure-${{ github.run_id }}
          path: |
            xynes-cms-console-web/playwright-report
            xynes-cms-console-web/test-results
          if-no-files-found: ignore
          retention-days: 3
