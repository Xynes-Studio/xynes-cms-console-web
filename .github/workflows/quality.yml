name: CMS quality

on:
  pull_request:
    branches:
      - develop
      - main
      - "release/*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cms-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code and browser gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://fixtures.supabase.local
      NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-anon-key
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3200/api/e2e
      NEXT_PUBLIC_AUTH_APP_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3200
      NEXT_PUBLIC_ALLOWED_REDIRECT_DOMAINS: 127.0.0.1:3200,localhost:3200
      NEXT_PUBLIC_ENABLE_E2E_FIXTURES: "1"
    steps:
      - name: Check out CMS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: xynes-cms-console-web
          persist-credentials: false

      - name: Check out frontend infrastructure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Xynes-Studio/xynes-frontend-infra
          ref: develop
          path: infra
          token: ${{ secrets.XYNES_REPO_READ_TOKEN }}
          persist-credentials: false

      - name: Check out Lumia design system
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Xynes-Studio/lumia-ds
          ref: develop
          path: lumia-ds
          token: ${{ secrets.XYNES_REPO_READ_TOKEN }}
          persist-credentials: false

      - name: Check out auth SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Xynes-Studio/xynes-auth-sdk
          ref: develop
          path: xynes-auth-sdk
          token: ${{ secrets.XYNES_REPO_READ_TOKEN }}
          persist-credentials: false

      - name: Check out locale package
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Xynes-Studio/xynes-i18n
          ref: develop
          path: xynes-i18n
          token: ${{ secrets.XYNES_REPO_READ_TOKEN }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.15.0

      - name: Enable the pinned package manager
        run: |
          npm install --global corepack@0.34.0
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Install CMS dependencies
        working-directory: xynes-cms-console-web
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for Playwright
        working-directory: xynes-cms-console-web
        run: pnpm exec playwright install --with-deps chrome

      - name: Run release verification
        working-directory: xynes-cms-console-web
        run: pnpm verify:release

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cms-quality-failure-${{ github.run_id }}
          path: |
            xynes-cms-console-web/playwright-report
            xynes-cms-console-web/test-results
          if-no-files-found: ignore
          retention-days: 3
