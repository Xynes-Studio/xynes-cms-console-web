# Generated from xynes-infra scripts/setup/ci-quality-profiles.json.
name: "Protected release provenance"
"on":
  workflow_dispatch: {}
permissions:
  contents: "read"
concurrency:
  group: "release-${{ github.repository }}"
  cancel-in-progress: false
jobs:
  preflight:
    name: "Protected release preflight"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    permissions:
      contents: "read"
    steps:
      -
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        with:
          persist-credentials: false
      -
        uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6"
        with:
          bun-version: "1.4.2"
      -
        name: "Refuse dispatch outside protected main before using release credentials"
        run: "bun .github/ci/release-gates.ts --source"
  policy:
    name: "Verify protected release checks"
    needs: "preflight"
    if: "github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    environment: "release"
    permissions:
      contents: "read"
      checks: "read"
    steps:
      -
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        with:
          persist-credentials: false
      -
        uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6"
        with:
          bun-version: "1.4.2"
      -
        name: "Verify actual protected policy and latest exact-commit gates"
        run: "bun .github/ci/release-gates.ts"
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_POLICY_READ_TOKEN: "${{ secrets.RELEASE_POLICY_READ_TOKEN }}"
  build:
    name: "Build release candidate"
    needs:
      - "preflight"
      - "policy"
    if: "github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 45
    environment: "release"
    permissions:
      contents: "read"
    defaults:
      run:
        shell: "bash"
    outputs:
      digest: "${{ steps.package.outputs.digest }}"
    steps:
      -
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        with:
          persist-credentials: false
          path: "xynes-cms-console-web"
      -
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        with:
          persist-credentials: false
          path: "lumia-ds"
          repository: "Xynes-Studio/lumia-ds"
          ref: "c70136d56750ee7ade0bd5dedbd1e39803aa622e"
      -
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        with:
          persist-credentials: false
          path: "xynes-auth-sdk"
          repository: "Xynes-Studio/xynes-auth-sdk"
          ref: "7003ea39d18f0335cd5cb0f1e948aa1cb4e1a131"
      -
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        with:
          persist-credentials: false
          path: "xynes-i18n"
          repository: "Xynes-Studio/xynes-i18n"
          ref: "cd0f0c2e367974bad69392dd8976c9b7a27830c8"
      -
        uses: "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"
        with:
          node-version: "22.22.0"
      -
        uses: "pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1"
        with:
          version: "10.33.0"
      -
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @lumia-ui/components... --filter @lumia-ui/forms... --filter @lumia-ui/editor... --filter @lumia-ui/icons... --filter @lumia-ui/layout... --filter @lumia-ui/marketing... build
        working-directory: "lumia-ds"
      -
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        working-directory: "xynes-auth-sdk"
      -
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        working-directory: "xynes-i18n"
      -
        run: "pnpm install --frozen-lockfile --ignore-workspace"
        working-directory: "xynes-cms-console-web"
      -
        uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6"
        with:
          bun-version: "1.4.2"
      -
        run: "bun .github/ci/release-gates.ts --public-build"
        working-directory: "xynes-cms-console-web"
      -
        run: "NODE_ENV=production pnpm exec next build --webpack"
        working-directory: "xynes-cms-console-web"
      -
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP:?}/release-candidate"
          mkdir -p "$artifact_dir"
          python3 - <<'PY'
          import json,os,pathlib
          record=json.loads('{"artifact_kind": "compiled-next-production-output", "linked_source_commits": {"lumia-ds": "c70136d56750ee7ade0bd5dedbd1e39803aa622e", "xynes-auth-sdk": "7003ea39d18f0335cd5cb0f1e948aa1cb4e1a131", "xynes-i18n": "cd0f0c2e367974bad69392dd8976c9b7a27830c8"}, "runtime_versions": {"bun": "1.4.2", "node": "22.22.0", "pnpm": "10.33.0"}}')
          record.update(repository=os.environ["GITHUB_REPOSITORY"], source_commit=os.environ["GITHUB_SHA"], workflow_run_id=os.environ["GITHUB_RUN_ID"], workflow_run_attempt=os.environ["GITHUB_RUN_ATTEMPT"])
          pathlib.Path(os.environ["RUNNER_TEMP"],"release-candidate","build-record.json").write_text(json.dumps(record,sort_keys=True,indent=2)+"\n")
          PY
          tar --exclude=node_modules --exclude=.next/cache --exclude=coverage --exclude="*.tsbuildinfo" --exclude=".env" --exclude=".env.*" --exclude="*/.env" --exclude="*/.env.*" -czf "$artifact_dir/candidate.tar.gz" -C "$PWD" .next public package.json pnpm-lock.yaml -C "$artifact_dir" build-record.json
          printf 'digest=sha256:%s\n' "$(sha256sum "$artifact_dir/candidate.tar.gz" | cut -d' ' -f1)" >> "${GITHUB_OUTPUT:?}"
        working-directory: "xynes-cms-console-web"
        id: "package"
        name: "Package compiled outputs and source/run record"
      -
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "release-candidate-${{ github.sha }}"
          path: "${{ runner.temp }}/release-candidate/candidate.tar.gz"
          if-no-files-found: "error"
          retention-days: 14
    env:
      NEXT_PUBLIC_AUTH_APP_URL: "${{ vars.NEXT_PUBLIC_AUTH_APP_URL }}"
      NEXT_PUBLIC_APP_URL: "${{ vars.NEXT_PUBLIC_APP_URL }}"
      NEXT_PUBLIC_API_URL: "${{ vars.NEXT_PUBLIC_API_URL }}"
      NEXT_PUBLIC_SUPABASE_URL: "${{ vars.NEXT_PUBLIC_SUPABASE_URL }}"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
      NEXT_PUBLIC_ALLOWED_REDIRECT_DOMAINS: "${{ vars.NEXT_PUBLIC_ALLOWED_REDIRECT_DOMAINS }}"
  attest:
    name: "Attest protected release candidate"
    needs:
      - "preflight"
      - "policy"
      - "build"
    if: "github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    environment: "release"
    permissions:
      contents: "read"
      id-token: "write"
      attestations: "write"
    steps:
      -
        uses: "actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6"
        with:
          subject-name: "candidate.tar.gz"
          subject-digest: "${{ needs.build.outputs.digest }}"
          push-to-registry: false
          create-storage-record: false
