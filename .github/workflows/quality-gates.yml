# Generated from xynes-infra scripts/setup/ci-quality-profiles.json.
name: "Required quality gates"
"on":
  pull_request:
    branches:
      - "main"
      - "develop"
      - "release/*"
  push:
    branches:
      - "main"
      - "develop"
      - "release/*"
  workflow_dispatch: {}
permissions:
  contents: "read"
concurrency:
  group: "quality-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  gates:
    name: "${{ matrix.gate }}"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gate:
          - "lint"
          - "test"
          - "coverage"
          - "typecheck"
          - "build"
    env:
      GATE_NAME: "${{ matrix.gate }}"
      NEXT_PUBLIC_AUTH_APP_URL: "http://localhost:3100"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_API_URL: "http://127.0.0.1:4100"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "fixture-public-key"
      NEXT_PUBLIC_ALLOWED_REDIRECT_DOMAINS: "localhost:3000,localhost:3100,127.0.0.1:3200"
    steps:
      -
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        with:
          persist-credentials: false
          path: "xynes-cms-console-web"
      -
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        with:
          persist-credentials: false
          path: "lumia-ds"
          repository: "Xynes-Studio/lumia-ds"
          ref: "cbd49e2a84e1d56e0120eef5d1ef2fbfda864943"
      -
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        with:
          persist-credentials: false
          path: "xynes-auth-sdk"
          repository: "Xynes-Studio/xynes-auth-sdk"
          ref: "fae49e08898d309fee03c645fd54eb831a8b524c"
      -
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        with:
          persist-credentials: false
          path: "xynes-i18n"
          repository: "Xynes-Studio/xynes-i18n"
          ref: "16c31d264e1065c443f57311fc96768022c1605b"
      -
        uses: "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"
        with:
          node-version: "22.22.0"
      -
        uses: "pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1"
        with:
          version: "10.33.0"
      -
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @lumia-ui/components... --filter @lumia-ui/forms... --filter @lumia-ui/editor... --filter @lumia-ui/icons... --filter @lumia-ui/layout... --filter @lumia-ui/marketing... build
        working-directory: "lumia-ds"
      -
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        working-directory: "xynes-auth-sdk"
      -
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        working-directory: "xynes-i18n"
      -
        run: "pnpm install --frozen-lockfile --ignore-workspace"
        working-directory: "xynes-cms-console-web"
      -
        run: |
          case "$GATE_NAME" in
            lint)
              pnpm exec eslint .
              ;;
            test)
              pnpm exec vitest run
              ;;
            coverage)
              pnpm exec vitest run --coverage
              ;;
            typecheck)
              pnpm exec tsc --noEmit
              ;;
            build)
              NODE_ENV=production pnpm exec next build --webpack
              ;;
            *) exit 2 ;;
          esac
        working-directory: "xynes-cms-console-web"
